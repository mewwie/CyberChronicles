<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PII Redactor</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <h1>PII Redactor</h1>

    <h2>Redact from Text</h2>
    <form id="text-form">
        <textarea name="text" rows="10" cols="50" placeholder="Paste your text here..."></textarea>
        <br>
        <button type="submit">Redact Text</button>
    </form>

    <h2>Redact from File</h2>
    <form id="file-form" enctype="multipart/form-data">
        <input type="file" name="file" accept=".txt,.pdf">
        <br>
        <button type="submit">Redact File</button>
    </form>

    <h2>Result:</h2>
    <div id="result-div"></div>

    <script src="app.js"></script>
</body>
</html>

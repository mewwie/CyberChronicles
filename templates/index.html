<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PII Redactor</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <h1>PII Redaction Service</h1>
    <label for="input-type">Select input type:</label>
    <select id="input-type" onchange="toggleInput()">
        <option value="text">Text</option>
        <option value="file">File</option>
    </select>

    <div id="text-input-div">
        <form action="/redact" method="post">
            <textarea name="text" rows="10" cols="50" placeholder="Paste your text here..."></textarea>
            <br>
            <button type="submit">Redact Text</button>
        </form>
    </div>

    <div id="file-input-div" style="display: none;">
        <form action="/redact" method="post" enctype="multipart/form-data">
            <input type="file" name="file" accept=".pdf,.doc,.docx,.txt">
            <br>
            <button type="submit">Redact File</button>
        </form>
    </div>

    <script>
        function toggleInput() {
            var selectedType = document.getElementById('input-type').value;
            if (selectedType === 'text') {
                document.getElementById('text-input-div').style.display = 'block';
                document.getElementById('file-input-div').style.display = 'none';
            } else {
                document.getElementById('text-input-div').style.display = 'none';
                document.getElementById('file-input-div').style.display = 'block';
            }
        }
    </script>
</body>
</html>
